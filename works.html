<script type="application/json" id="langname">{"ko": "국문", "en": "영문", "ja": "일문", "zh": "중문"}</script>
<script type="application/json" id="typename">{"저서": "저서", "편저": "편저", "역서": "역서", "논문": "논문", "학위논문": "학위논문", "장(章)": "장(章)", "기고": "기고", "좌담": "좌담", "서평": "서평", "보고서": "보고서", "기타": "기타"}</script>
<script type="application/json" id="ui-strings">{"cnt": "건", "of": "전체", "dash": "—", "link": "원문", "pdf": "PDF", "undated": "연도 미상", "uncertain": "판정 미정", "conf": {"미정": "판정 미정", "정정필요": "서지 정정 필요", "미검증": "미검증", "정정": "정정됨"}, "root": ""}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('works-data').textContent);
  const S = JSON.parse(document.getElementById('scholars-data').textContent);
  const LANGNAME = JSON.parse(document.getElementById('langname').textContent);
  const TYPENAME = JSON.parse(document.getElementById('typename').textContent);
  const T = JSON.parse(document.getElementById('ui-strings').textContent);
  const nameOf = {}; S.forEach(s => nameOf[s.id] = s.name);

  const q = document.getElementById('q');
  const fSc = document.getElementById('f-scholar');
  const fTy = document.getElementById('f-type');
  const fDe = document.getElementById('f-decade');
  const fLa = document.getElementById('f-lang');
  const tbody = document.querySelector('#wtable tbody');
  const cnt = document.getElementById('cnt');
  let sortKey = 'year', sortDir = 1;

  function norm(s){ return (s||'').toString().toLowerCase(); }

  function rows(){
    const t = norm(q.value).trim();
    return D.filter(w => {
      if (fSc.value && w.author !== fSc.value) return false;
      if (fTy.value && w.type !== fTy.value) return false;
      if (fLa.value && (w.lang||'ko') !== fLa.value) return false;
      if (fDe.value){
        const d = Math.floor((w.year||0)/10)*10;
        if (String(d) !== fDe.value) return false;
      }
      if (t){
        const hay = norm(w.title)+' '+norm(w.title_original)+' '+norm(nameOf[w.author])+' '
          +norm((w.authors_all||[]).join(' '))+' '+norm(w.venue)+' '+norm(w.publisher);
        if (!hay.includes(t)) return false;
      }
      return true;
    });
  }

  function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

  function render(){
    const r = rows();
    r.sort((a,b)=>{
      let x,y;
      if (sortKey==='year'){ x=a.year||9999; y=b.year||9999; }
      else if (sortKey==='author'){ x=nameOf[a.author]||''; y=nameOf[b.author]||''; }
      else { x=(a[sortKey]||'').toString(); y=(b[sortKey]||'').toString(); }
      if (x<y) return -sortDir; if (x>y) return sortDir;
      return (a.year||0)-(b.year||0);
    });
    tbody.innerHTML = r.map(w => {
      const un = w.confidence === '미정' || w.confidence === '정정필요' || w.confidence === '미검증';
      const venue = [w.venue, w.publisher].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' / ');
      const vi = w.vol_issue ? ' ' + esc(w.vol_issue) : '';
      const url = w.url || (w.doi ? 'https://doi.org/'+w.doi : '');
      return '<tr'+(un?' class="uncertain"':'')+'>'
        + '<td class="yr">'+(w.year||T.undated)+'</td>'
        + '<td>'+esc(nameOf[w.author]||w.author)+'</td>'
        + '<td>'+esc(w.title)+(w.title_original?' <span class="hanja">'+esc(w.title_original)+'</span>':'')
          +(un?'<span class="badge-uc">'+(T.conf[w.confidence]||T.uncertain)+'</span>':'')+'</td>'
        + '<td class="ty">'+esc(TYPENAME[w.type]||w.type)+'</td>'
        + '<td class="vn">'+esc(venue)+vi+'</td>'
        + '<td class="vn">'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+T.link+'</a>':'')
          +(w.file?(url?' · ':'')+'<a href="'+esc(T.root+w.file)+'" target="_blank" rel="noopener" title="'+esc(w.license||'')+'">'+T.pdf+'</a>':'')
          +((url||w.file)?'':T.dash)+'</td>'
        + '</tr>';
    }).join('');
    cnt.textContent = T.of+' '+D.length+' '+T.cnt+' → '+r.length+' '+T.cnt;
  }

  function csv(){
    const r = rows();
    const head = ['id','author','year','title','type','venue','publisher','vol_issue','pages','lang','doi','url','file','license','confidence'];
    const q2 = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const body = r.map(w => head.map(h => q2(h==='author'? (nameOf[w.author]||w.author) : w[h])).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+head.join(',')+'\n'+body], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'dongju-works.csv'; a.click();
  }

  [q,fSc,fTy,fDe,fLa].forEach(el => el.addEventListener('input', render));
  document.getElementById('csv').addEventListener('click', e => { e.preventDefault(); csv(); });
  document.querySelectorAll('#wtable th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
      document.querySelectorAll('#wtable th.sortable').forEach(x =>
        x.classList.remove('asc','desc'));
      th.classList.add(sortDir>0?'asc':'desc');
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
